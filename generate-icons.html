<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Gerar Ícones Keeper</title>
<style>
  body { background: #0e1020; color: #eef0f7; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
  canvas { border: 1px solid #2a2f55; margin: 10px; }
  a { color: #e6b84c; margin: 10px; }
</style>
</head>
<body>
<h1>Gerar Ícones PWA</h1>
<p>Clica nos links abaixo para descarregar os ícones:</p>
<canvas id="c192" width="192" height="192"></canvas>
<a id="d192" download="icon-192.png">Descarregar 192x192</a>
<canvas id="c512" width="512" height="512"></canvas>
<a id="d512" download="icon-512.png">Descarregar 512x512</a>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext("2d");
  const s = canvas.width;
  const r = s * 0.42;
  const cx = s / 2, cy = s / 2;

  // Fundo
  ctx.fillStyle = "#0e1020";
  ctx.fillRect(0, 0, s, s);

  // Escudo
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.bezierCurveTo(cx + r * 0.8, cy - r, cx + r, cy - r * 0.5, cx + r, cy + r * 0.1);
  ctx.lineTo(cx + r * 0.85, cy + r * 0.85);
  ctx.quadraticCurveTo(cx, cy + r * 1.1, cx - r * 0.85, cy + r * 0.85);
  ctx.lineTo(cx - r, cy + r * 0.1);
  ctx.bezierCurveTo(cx - r, cy - r * 0.5, cx - r * 0.8, cy - r, cx, cy - r);
  ctx.closePath();
  ctx.fillStyle = "#181b36";
  ctx.fill();
  ctx.strokeStyle = "#e6b84c";
  ctx.lineWidth = s * 0.02;
  ctx.stroke();

  // Coroa
  const ky = cy - r * 0.35;
  const kw = r * 0.5;
  ctx.beginPath();
  ctx.moveTo(cx - kw, ky + r * 0.25);
  ctx.lineTo(cx - kw, ky);
  ctx.lineTo(cx - kw * 0.5, ky + r * 0.12);
  ctx.lineTo(cx, ky - r * 0.1);
  ctx.lineTo(cx + kw * 0.5, ky + r * 0.12);
  ctx.lineTo(cx + kw, ky);
  ctx.lineTo(cx + kw, ky + r * 0.25);
  ctx.closePath();
  ctx.fillStyle = "#e6b84c";
  ctx.fill();

  // K
  ctx.fillStyle = "#0e1020";
  ctx.font = "bold " + (s * 0.18) + "px Georgia, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("K", cx, cy + r * 0.55);
}

drawIcon(document.getElementById("c192"));
drawIcon(document.getElementById("c512"));

document.getElementById("d192").href = document.getElementById("c192").toDataURL("image/png");
document.getElementById("d512").href = document.getElementById("c512").toDataURL("image/png");
</script>
</body>
</html>
